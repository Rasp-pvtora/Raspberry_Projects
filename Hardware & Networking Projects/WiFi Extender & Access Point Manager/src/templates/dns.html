{% extends "layout.html" %}
{% block title %}DNS — WiFi AP Manager{% endblock %}
{% block page_title %}DNS Configuration{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3>🔗 Upstream DNS Servers</h3>
    </div>
    <div class="card-body">
        <div class="form-group">
            <label>Primary DNS</label>
            <input type="text" id="dnsPrimary" placeholder="1.1.1.1">
        </div>
        <div class="form-group">
            <label>Secondary DNS</label>
            <input type="text" id="dnsSecondary" placeholder="8.8.8.8">
        </div>
        <div class="dns-presets">
            <h4>Quick Presets:</h4>
            <button class="btn btn-sm" onclick="setPreset('1.1.1.1','1.0.0.1')">Cloudflare</button>
            <button class="btn btn-sm" onclick="setPreset('8.8.8.8','8.8.4.4')">Google</button>
            <button class="btn btn-sm" onclick="setPreset('9.9.9.9','149.112.112.112')">Quad9</button>
            <button class="btn btn-sm" onclick="setPreset('208.67.222.222','208.67.220.220')">OpenDNS</button>
        </div>
        <div class="card-actions">
            <button class="btn btn-primary" onclick="saveDNS()">Save DNS</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadDNS() {
    try {
        const resp = await fetch('/api/dns');
        if (!resp.ok) return;
        const data = await resp.json();
        document.getElementById('dnsPrimary').value = data.primary || '';
        document.getElementById('dnsSecondary').value = data.secondary || '';
    } catch(e) { console.error(e); }
}
function setPreset(p, s) {
    document.getElementById('dnsPrimary').value = p;
    document.getElementById('dnsSecondary').value = s;
}
async function saveDNS() {
    const primary = document.getElementById('dnsPrimary').value;
    const secondary = document.getElementById('dnsSecondary').value;
    const resp = await fetch('/api/dns', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({primary, secondary})});
    if (resp.ok) alert('DNS updated'); else alert('Failed to update DNS');
}
loadDNS();
</script>
{% endblock %}
