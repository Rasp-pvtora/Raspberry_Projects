{% extends "layout.html" %}
{% block title %}Models — PrivateGPT{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Model Management</h1>
</div>

<div class="model-controls">
    <div class="form-group form-inline">
        <input type="text" id="pull-model-name" placeholder="Model name (e.g. llama3:8b-q4_0)">
        <button class="btn btn-secondary" id="pull-btn">Pull Model</button>
    </div>
    <p>Active model: <strong id="active-model">—</strong></p>
</div>

<div class="models-table-wrapper">
    <table class="models-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Size</th>
                <th>Modified</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="models-body">
            <tr><td colspan="4">Loading...</td></tr>
        </tbody>
    </table>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/models.js') }}"></script>
{% endblock %}
